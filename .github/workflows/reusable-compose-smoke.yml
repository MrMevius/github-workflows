name: Reusable Docker Compose Smoke

on:
  workflow_call:
    inputs:
      mevius-ci:
        description: Use the caller repository’s private Mevius runner
        type: boolean
        default: false
      compose-file:
        description: Docker Compose file
        required: false
        type: string
        default: "docker-compose.yml"
      env-example:
        description: Example environment file copied to .env
        required: false
        type: string
        default: ".env.example"
      services:
        description: Space-separated services to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  compose-smoke:
    name: Docker Compose smoke build
    runs-on: ${{ inputs.mevius-ci && fromJSON('["self-hosted","Linux","X64","mevius-ci"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: ${{ !inputs.mevius-ci }}

      - name: Prepare environment file
        run: cp "${{ inputs.env-example }}" .env

      - name: Validate Compose configuration
        run: docker compose -f "${{ inputs.compose-file }}" config >/dev/null

      - name: Build Docker services
        run: docker compose -f "${{ inputs.compose-file }}" build ${{ inputs.services }}
