name: Reusable Python CI

on:
  workflow_call:
    inputs:
      mevius-ci:
        description: Use the caller repository’s private Mevius runner
        type: boolean
        default: false
      python-version:
        description: Python version
        required: false
        type: string
        default: "3.11"
      working-directory:
        description: Directory containing the Python project
        required: false
        type: string
        default: "."
      cache-dependency-path:
        description: Dependency file used for pip cache invalidation
        required: false
        type: string
        default: "pyproject.toml"
      install-command:
        description: Dependency installation command
        required: false
        type: string
        default: "pip install -e .[dev]"
      test-command:
        description: Test command
        required: false
        type: string
        default: "pytest"

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ${{ inputs.mevius-ci && fromJSON('["self-hosted","Linux","X64","mevius-ci"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: ${{ !inputs.mevius-ci }}

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.install-command }}

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}
