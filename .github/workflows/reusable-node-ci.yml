name: Reusable Node CI

on:
  workflow_call:
    inputs:
      mevius-ci:
        description: Use the caller repository’s private Mevius runner
        type: boolean
        default: false
      node-version:
        description: Node.js version
        required: false
        type: string
        default: "20"
      working-directory:
        description: Directory containing the Node project
        required: false
        type: string
        default: "."
      cache-dependency-path:
        description: Lockfile used for npm cache invalidation
        required: false
        type: string
        default: "package-lock.json"
      test-command:
        description: Test command
        required: false
        type: string
        default: "npm test"
      build-command:
        description: Build command
        required: false
        type: string
        default: "npm run build"

permissions:
  contents: read

jobs:
  test-build:
    name: Node tests and build
    runs-on: ${{ inputs.mevius-ci && fromJSON('["self-hosted","Linux","X64","mevius-ci"]') || 'ubuntu-latest' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: ${{ !inputs.mevius-ci }}

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: npm ci

      - name: Run tests
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test-command }}

      - name: Build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.build-command }}
